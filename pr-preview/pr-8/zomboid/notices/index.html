<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>공지 페이지 이동 중 | Choromi</title>
  <link rel="canonical" href="https://choromi1.github.io/games/notices/?game=zomboid" />
  <script>
    (function () {
      const target = new URL("../../notices/", window.location.href);
      const params = new URLSearchParams(window.location.search);
      if (!params.has("game")) params.set("game", "zomboid");
      target.search = params.toString();
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p><a href="../../notices/?game=zomboid">Project Zomboid 공지 페이지로 이동</a></p>
</body>
</html>

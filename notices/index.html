<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Choromi 게임 서버의 최신 공지와 운영 안내" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#0b1014" />
  <title>게임 서버 공지 | Choromi</title>
  <link rel="canonical" href="https://choromi1.github.io/games/notices/" />
  <link rel="icon" type="image/png" href="../shared/assets/favicon.png" />
  <link rel="apple-touch-icon" href="../shared/assets/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="Choromi Game Servers" />
  <meta property="og:title" content="게임 서버 공지 | Choromi" />
  <meta property="og:description" content="Project Zomboid와 Valheim의 최신 공지를 한곳에서 확인하세요." />
  <meta property="og:url" content="https://choromi1.github.io/games/notices/" />
  <meta property="og:image" content="https://choromi1.github.io/games/shared/assets/choromi-og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="../shared/chrome.css?v=3" />
  <link rel="stylesheet" href="../shared/notices.css?v=1" />
</head>
<body>
  <div class="notice-page">
    <header class="global-header" data-global-header>
      <a class="global-brand" href="../" aria-label="Choromi 게임 서버 선택 화면">
        <span class="global-brand-mark"><img src="../shared/assets/choromi-brand.webp" alt="초로미" /></span>
        <span class="global-brand-copy"><strong>Choromi Game Servers</strong><small>Shared Notice Archive</small></span>
      </a>
      <button class="global-menu-button" type="button" aria-expanded="false" aria-controls="global-nav-panel">메뉴</button>
      <div class="global-nav-panel" id="global-nav-panel">
        <nav class="global-game-switch" aria-label="게임 페이지 전환">
          <a href="../Valheim/">Valheim</a>
          <a href="../zomboid/">Project Zomboid</a>
        </nav>
        <nav class="global-page-links" aria-label="현재 페이지 메뉴">
          <a aria-current="page" href="./">전체 공지</a>
          <a href="../admin/">공지 관리</a>
        </nav>
      </div>
    </header>

    <main>
      <header class="notice-hero">
        <div class="notice-hero-row">
          <div>
            <span class="eyebrow">Shared Notice Archive</span>
            <h1 id="archive-title">게임 서버 공지</h1>
            <p id="archive-description">게임별 점검, 업데이트, 이벤트와 주요 운영 안내를 확인할 수 있습니다.</p>
          </div>
          <a class="button secondary small" id="selected-game-link" href="../">게임 페이지 열기</a>
        </div>
        <nav class="game-switch" id="game-switch" aria-label="공지 대상 게임"></nav>
      </header>

      <section class="notice-panel" id="archive-view">
        <div class="invalid-game-banner hidden" id="invalid-game-banner" role="alert"></div>
        <div class="connection-banner hidden" id="supabase-demo-banner"><strong>미리보기 모드</strong><span>Supabase 연결 전이라 예시 공지를 표시하고 있습니다.</span></div>
        <div class="archive-toolbar">
          <div class="filter-chips" id="notice-filters" aria-label="공지 카테고리 필터"></div>
          <label class="search-box"><span class="sr-only">공지 검색</span><input id="notice-search" type="search" placeholder="제목 또는 내용 검색" /></label>
        </div>
        <div class="archive-list" id="notice-list" aria-live="polite"></div>
        <div class="pagination" id="pagination" aria-label="공지 페이지 이동"></div>
      </section>

      <article class="notice-detail hidden" id="detail-view" aria-live="polite"></article>
    </main>

    <footer class="global-footer">
      <div class="global-footer-brand">
        <span class="global-brand-mark"><img src="../shared/assets/choromi-brand.webp" alt="초로미" /></span>
        <div class="global-footer-copy"><strong>Choromi Game Servers</strong><span>Shared Notice Archive</span></div>
      </div>
      <nav class="global-footer-links" aria-label="사이트 하단 메뉴">
        <a href="../">게임 선택</a>
        <a href="../Valheim/">Valheim</a>
        <a href="../zomboid/">Project Zomboid</a>
        <a href="./">전체 공지</a>
      </nav>
      <small>© <span data-current-year></span> Choromi</small>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="../shared/chrome.js?v=1"></script>
  <script src="../shared/notice-config.js?v=1"></script>
  <script src="../shared/notice-service.js?v=1"></script>
  <script src="./notices.js?v=1"></script>
</body>
</html>
